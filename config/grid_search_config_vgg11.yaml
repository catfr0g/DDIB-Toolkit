# Grid Search Configuration for DDIB Training
model_archs:
    - vgg11

bottleneck_widths:
    - 16
    - 32
    - 64
    - 128
    - 256
    - 512
    - 1024
    - 2048

betas:
    - 0.0001
    - 0.001
    - 0.01
    - 0.1
    - 1.0
    - 10.0
    - 100.0

seeds:
    - 42
    - 12
    - 1984

training_params:
    train_batch_size: 128 # Increase to 128 because we have enough memory
    val_batch_size: 128 # Increase to 128 because we have enough memory
    test_batch_size: 128 # Increase to 128 because we have enough memory
    num_epochs: 100 # Reduced from 200 to speed up search
    learning_rate: 0.001 # Changed back to original value
    weight_decay: 0.0001
    alpha: 1.01
    train_val_split_ratio: 0.8
    num_workers: 2 # Increased for better data loading
    download: true
    precision: "16-mixed" # Enable mixed precision training for GPU
    use_scheduler: true # Enable learning rate scheduling
    scheduler_type: "reduceonplateau" # Options: "reduceonplateau", "step", "cosine"
