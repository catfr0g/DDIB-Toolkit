# Robustness Validation Configuration
#
# This configuration defines model architectures and their training parameters
# for robustness evaluation on CIFAR-10-C corruptions and PGD adversarial attacks.
#
# Usage:
#   make robustness CONFIG=config/robustness_config.yaml
#   python -m src.experiments.robustness.validate --config config/robustness_config.yaml

# Model configurations to evaluate
models:
  # VGG11 - Best overall performance
  - name: vgg11_best
    model_arch: vgg11
    bottleneck_width: 2048
    beta: 1.0e-08
    seed: 1984
    description: "VGG11 with 2048 bottleneck - best overall accuracy"
    # Training hyperparameters (overrides defaults)
    training:
      num_epochs: 100
      learning_rate: 0.001
      weight_decay: 0.0001
      train_batch_size: 128
      val_batch_size: 128
      test_batch_size: 128

  # VGG11 - Alternative good configuration
  - name: vgg11_alt
    model_arch: vgg11
    bottleneck_width: 2048
    beta: 1.0e-06
    seed: 12
    description: "VGG11 with 2048 bottleneck - alternative config"
    training:
      num_epochs: 100
      learning_rate: 0.001
      weight_decay: 0.0001

  # ResNet18 - Best configuration
  - name: resnet18_best
    model_arch: resnet18
    bottleneck_width: 2048
    beta: 1.0e-06
    seed: 42
    description: "ResNet18 with 2048 bottleneck - best accuracy"
    training:
      num_epochs: 100
      learning_rate: 0.001
      weight_decay: 0.0001

  # ResNet18 - Alternative good configuration
  - name: resnet18_alt
    model_arch: resnet18
    bottleneck_width: 2048
    beta: 1.0e-07
    seed: 42
    description: "ResNet18 with 2048 bottleneck - alternative config"
    training:
      num_epochs: 100
      learning_rate: 0.001
      weight_decay: 0.0001

  # EfficientNet-B0 - Representative configuration
  - name: efficientnet_b0_best
    model_arch: efficientnet_b0
    bottleneck_width: 16
    beta: 1.0e-06
    seed: 42
    description: "EfficientNet-B0 with 16 bottleneck - best found"
    training:
      num_epochs: 100
      learning_rate: 0.001
      weight_decay: 0.0001

# Default training hyperparameters (used if not specified in model config)
training_defaults:
  num_epochs: 100
  train_batch_size: 128
  val_batch_size: 128
  test_batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  alpha: 1.01
  train_val_split_ratio: 0.8
  num_workers: 4
  precision: "16-mixed"
  use_scheduler: true
  scheduler_type: "reduceonplateau"

# Robustness evaluation settings
evaluation:
  # PGD Attack settings
  pgd:
    epsilon: 0.03137254901960784  # 8/255
    alpha: 0.00784313725490196   # 2/255
    iterations: 10
    norm: "inf"
    max_samples: 1000  # Limit samples for computational efficiency

  # CIFAR-10-C settings
  corruptions:
    types:
      - gaussian_noise
      - shot_noise
      - impulse_noise
      - defocus_blur
      - glass_blur
      - motion_blur
      - zoom_blur
      - snow
      - frost
      - fog
      - brightness
      - contrast
      - elastic_transform
      - pixelate
      - jpeg_compression
    severity_levels: [1, 2, 3, 4, 5]

  # Evaluation batch settings
  batch_size: 64
  num_workers: 4

  # Evaluation modes (can be overridden via CLI)
  skip_corruptions: false
  skip_pgd: false
