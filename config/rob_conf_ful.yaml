# Robustness evaluation settings
evaluation:
  # PGD Attack settings
  pgd:
    epsilon: 0.03137254901960784 # 8/255
    alpha: 0.00784313725490196 # 2/255
    iterations: 10
    norm: "inf"
    max_samples: 1000 # Limit samples for computational efficiency

  # CIFAR-10-C settings
  corruptions:
    types:
      - gaussian_noise
      - shot_noise
      - impulse_noise
      - defocus_blur
      - glass_blur
      - motion_blur
      - zoom_blur
      - snow
      - frost
      - fog
      - brightness
      - contrast
      - elastic_transform
      - pixelate
      - jpeg_compression
    severity_levels: [1, 2, 3, 4, 5]

  # Evaluation batch settings
  batch_size: 64
  num_workers: 4

  # Evaluation modes (can be overridden via CLI)
  skip_corruptions: false
  skip_pgd: false
