# Robustness Validation Configuration
#
# This configuration defines model architectures and their training parameters
# for robustness evaluation on CIFAR-10-C corruptions and PGD adversarial attacks.
#
# Usage:
#   make robustness CONFIG=config/robustness_config.yaml
#   python -m src.experiments.robustness.validate --config config/robustness_config.yaml

# Model configurations to evaluate
models:
  - name: optimal_resnet18_1.0e-07
    model_arch: resnet18
    bottleneck_width: 2048
    beta: 1.0e-07
    seed: 78923
    training:
      num_epochs: 100
      learning_rate: 0.001
      weight_decay: 0.0001
      train_batch_size: 1024
      val_batch_size: 1024
      test_batch_size: 1024

